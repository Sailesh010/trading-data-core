version: 2

models:
  - name: stg_operational__trades
    description: Typed and normalized operational trades.
    columns:
      - name: trade_id
        data_tests: [not_null, unique]
      - name: side
        data_tests:
          - accepted_values:
              arguments:
                values: [BUY, SELL]
      - name: price
        data_tests: [not_null]
      - name: executed_at
        data_tests: [not_null]
  - name: stg_operational__ledger_entries
    description: Typed and normalized operational ledger postings.
    columns:
      - name: entry_id
        data_tests: [not_null, unique]
      - name: direction
        data_tests:
          - accepted_values:
              arguments:
                values: [DEBIT, CREDIT]
